server:
  port: 8082
  tomcat:
    max-http-form-post-size: -1
spring:
  jmx:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
  application:
    name: ZXSH
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/hmdp?useSSL=false&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123
  data:
    redis:
      host: 10.39.255.75
      port: 6379
      password: 123321
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.zxsh.entity # 别名扫描包
logging:
  level:
    com.zxsh: debug

# ==================== LangChain4j 智能客服配置（阿里百炼 OpenAI 兼容接口） ====================
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DASHSCOPE_API_KEY}          # 从系统环境变量读取阿里云百炼 API Key
      model-name: qwen-plus                   # Qwen 模型：qwen-turbo / qwen-plus / qwen-max
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1  # 百炼 OpenAI 兼容端点
      max-tokens: 2000                        # 单次回复最大 token 数
      temperature: 0.7                        # 创造性参数（0~1，越高越随机）
